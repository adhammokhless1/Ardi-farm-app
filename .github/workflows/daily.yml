name: Daily farm data
on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 6:00 Cairo
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save geotiff@2.1.3 proj4@2.11.0
      - run: node scripts/daily.mjs
      - name: Save data
        run: |
          git config user.name "farm-bot"
          git config user.email "farm-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily data $(date -u +%F)"
          git push
